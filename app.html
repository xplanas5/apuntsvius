<meta charset="utf-8">
<title>Apunts Vius</title>
<style>
/* Layout: quadern d'estudi. Barra superior amb domini i XP, pestanyes de mode, una columna de fins a 980px. Marcador fosforescent com a únic accent fort. */
:root{
  --paper:#f4f6fa; --sheet:#ffffff; --ink:#15203a; --muted:#5a6680; --line:#dce2ec; --line2:#c9d1df;
  --blue:#2546c4; --blue-ink:#ffffff; --blue-soft:#e7ecfb;
  --mark:#ffe14d; --on-mark:#1d1a05; --mark-soft:#fff5bf;
  --ok:#147445; --ok-soft:#e1f3e8; --bad:#bd3329; --bad-soft:#fbe6e3; --warn:#9a5800; --warn-soft:#fff0d6;
  --st-new:#d5dbe6; --st-prac:#8fb0ff; --st-cons:#3f66e0; --st-dom:#ffd21f;
  --shadow:0 1px 2px rgba(20,32,58,.06),0 4px 14px rgba(20,32,58,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1321; --sheet:#161d2f; --ink:#e6ebf6; --muted:#9ba7c2; --line:#273250; --line2:#34405f;
  --blue:#8ea5ff; --blue-ink:#0e1321; --blue-soft:#1d2849;
  --mark:#ffd84a; --on-mark:#1d1a05; --mark-soft:#3a3412;
  --ok:#5fd394; --ok-soft:#12301e; --bad:#ff8b80; --bad-soft:#3a1916; --warn:#ffbf5e; --warn-soft:#38290f;
  --st-new:#2c3754; --st-prac:#3d5aa8; --st-cons:#7d98ff; --st-dom:#ffd84a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1321; --sheet:#161d2f; --ink:#e6ebf6; --muted:#9ba7c2; --line:#273250; --line2:#34405f;
  --blue:#8ea5ff; --blue-ink:#0e1321; --blue-soft:#1d2849;
  --mark:#ffd84a; --on-mark:#1d1a05; --mark-soft:#3a3412;
  --ok:#5fd394; --ok-soft:#12301e; --bad:#ff8b80; --bad-soft:#3a1916; --warn:#ffbf5e; --warn-soft:#38290f;
  --st-new:#2c3754; --st-prac:#3d5aa8; --st-cons:#7d98ff; --st-dom:#ffd84a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand .hl{background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--blue);display:grid;place-items:center;color:var(--blue-ink);font-family:var(--f-display);font-weight:800}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;font-size:.85rem;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat strong{font-family:var(--f-mono);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap}
.tab:hover{background:var(--paper);color:var(--ink)}
.tab[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
.tab[disabled]{opacity:.4;cursor:not-allowed}
main.wrap{padding-block:22px 64px;display:grid;gap:18px}
/* Generic */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.stack{display:grid;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--line2);background:var(--sheet);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.mark{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.btn.ghost{border-color:transparent;background:none}
.btn.small{padding:6px 10px;font-size:.86rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.pill.mark{background:var(--mark);color:var(--on-mark);border-color:transparent}
.ai-note{font-size:.8rem;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:8px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--paper);border:1px solid var(--line2);border-radius:8px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
label.f{display:grid;gap:6px;font-weight:700;font-size:.92rem}
.mono{font-family:var(--f-mono)}
.hl{background:linear-gradient(transparent 55%,var(--mark-soft) 55%)}
.formula{font-family:var(--f-mono);font-size:1.05rem;background:var(--paper);border:1px dashed var(--line2);border-radius:8px;padding:8px 12px;display:inline-block;overflow-x:auto;max-width:100%}
.hero{display:grid;gap:14px;grid-template-columns:1.4fr 1fr;align-items:start}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
/* Topic cards */
.topic{display:grid;gap:10px}
.topic .meta{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:10px;border-radius:999px;background:var(--st-new);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* Notes */
.notes-layout{display:grid;gap:18px;grid-template-columns:220px 1fr;align-items:start}
@media (max-width:800px){.notes-layout{grid-template-columns:1fr}.toc{position:static!important}}
.toc{position:sticky;top:120px;display:grid;gap:2px}
.toc a{color:var(--muted);text-decoration:none;padding:5px 8px;border-radius:6px;font-weight:700;font-size:.9rem}
.toc a:hover{background:var(--sheet);color:var(--ink)}
.gloss{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.term{border:1px solid var(--line);border-radius:9px;padding:12px;display:grid;gap:6px;background:var(--sheet)}
.term h3 .hl{padding:0 2px}
.term .def.covered{filter:blur(6px);user-select:none;cursor:pointer}
.term .src{font-size:.8rem;color:var(--muted);border-left:3px solid var(--mark);padding-left:8px;font-style:italic}
.flag{border-color:var(--warn)!important;background:var(--warn-soft)!important}
ul.clean{margin:0;padding-left:1.1em;display:grid;gap:4px}
ol.steps{margin:0;padding-left:1.4em;display:grid;gap:6px}
.map-wrap{overflow-x:auto}
.map-wrap svg{display:block;max-width:none}
.tl{display:grid;gap:0;border-left:3px solid var(--line2);margin-left:6px}
.tl div{padding:6px 0 6px 14px;position:relative}
.tl div::before{content:"";position:absolute;left:-8px;top:12px;width:13px;height:13px;border-radius:50%;background:var(--blue)}
.tl b{font-family:var(--f-mono)}
/* Practice */
.qcard{display:grid;gap:14px}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--blue);transition:width .3s}
.prompt{font-size:1.12rem}
.prompt .big{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line2);background:var(--sheet);padding:11px 14px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:var(--blue)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted);min-width:1.2em}
.order{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.order li{display:flex;gap:8px;align-items:center;border:2px solid var(--line2);border-radius:9px;padding:8px 10px;background:var(--sheet)}
.order li .txt{flex:1;min-width:0}
.order li.right{border-color:var(--ok);background:var(--ok-soft)}
.order li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.order button{border:1px solid var(--line2);background:var(--paper);border-radius:6px;width:34px;height:34px;cursor:pointer}
.numin{display:flex;gap:8px;align-items:center}
.numin input{max-width:220px;font-family:var(--f-mono);font-size:1.1rem}
.numin .unit{font-family:var(--f-mono);color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{border-radius:9px;padding:12px 14px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.warn{background:var(--warn-soft);border:1px solid var(--warn)}
.fb.hint{background:var(--blue-soft);border:1px solid var(--blue)}
.fb h3{font-size:1rem}
.fb .src{font-size:.85rem;font-style:italic;border-left:3px solid var(--mark);padding-left:8px}
.xp-pop{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--mark);color:var(--on-mark);font-family:var(--f-display);font-weight:800;padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:20;animation:pop 1.8s ease forwards;pointer-events:none}
@keyframes pop{0%{transform:translateY(20px);opacity:0}15%{transform:none;opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.xp-pop{animation:none}.progress span{transition:none}}
.conf{display:flex;gap:8px;flex-wrap:wrap}
/* Lab */
.lab{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:start}
.stack>.formula{justify-self:start}
@media (max-width:800px){.lab{grid-template-columns:1fr}}
.slider{display:grid;gap:4px}
.slider .lbl{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.slider .lbl b{font-family:var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--blue)}
.readout{font-family:var(--f-mono);font-size:2rem;font-weight:600;letter-spacing:-.02em}
.readout small{font-size:1rem;color:var(--muted)}
canvas.plot{width:100%;height:220px;display:block;background:var(--paper);border-radius:8px;border:1px solid var(--line)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs .opt{font-size:.92rem}
/* Exam */
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.1rem;padding:4px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--sheet);cursor:pointer;font-family:var(--f-mono);font-size:.8rem}
.dots button.done{background:var(--blue-soft);border-color:var(--blue)}
.dots button.cur{outline:2px solid var(--blue)}
.score{font-family:var(--f-display);font-size:3.2rem;font-weight:800;line-height:1}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl{overflow-x:auto}
/* Progress */
.mastery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.cell{border-radius:7px;padding:7px 8px;font-size:.78rem;font-weight:700;line-height:1.2;min-height:46px;display:flex;align-items:flex-end;word-break:break-word}
.cell.s0{background:var(--st-new);color:var(--ink)}
.cell.s1{background:var(--st-prac);color:#0e1530}
.cell.s2{background:var(--st-cons);color:#fff}
.cell.s3{background:var(--st-dom);color:var(--on-mark)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px dashed var(--line2);border-radius:10px;padding:10px;display:grid;gap:4px;text-align:center}
.badge .ic{font-family:var(--f-display);font-weight:800;font-size:1.4rem;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:var(--paper);color:var(--muted)}
.badge.on{border-style:solid;border-color:var(--mark)}
.badge.on .ic{background:var(--mark);color:var(--on-mark)}
.calib{display:grid;gap:8px}
.calib .r{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:.9rem}
.calib .track{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.calib .track span{display:block;height:100%;background:var(--blue)}
/* Capture */
.drop{border:2px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;display:grid;gap:8px;background:var(--paper);cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:120px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}
.thumb img{display:block;width:120px;height:150px;object-fit:cover}
.thumb .tb{display:flex;justify-content:space-between;padding:4px}
.steps-run{display:grid;gap:6px;list-style:none;padding:0;margin:0}
.steps-run li{display:flex;gap:8px;align-items:center}
.steps-run li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--line2);flex:none}
.steps-run li.on::before{background:var(--mark);box-shadow:0 0 0 3px var(--mark-soft)}
.steps-run li.done::before{background:var(--ok)}
details summary{cursor:pointer;font-weight:700}
pre.code{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:260px;font-family:var(--f-mono);font-size:.78rem;white-space:pre-wrap}
.empty{padding:30px;text-align:center;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:4px 0}

/* ---- Navegació mòbil: capçalera amb «enrere» i barra inferior ---- */
.top .wrap{flex-wrap:nowrap}
.iconbtn{border:0;background:none;color:var(--ink);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--paper)}
.top-title{font-family:var(--f-display);font-weight:800;font-size:1.1rem;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title:empty{display:none}
#view{padding-block:18px calc(92px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom-nav .wrap{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end}
.bottom-nav button{border:0;background:none;color:var(--muted);font:inherit;font-size:.78rem;font-weight:700;display:grid;justify-items:center;gap:2px;padding:8px 4px 10px;cursor:pointer}
.bottom-nav button[aria-current="page"]{color:var(--blue)}
.bottom-nav .cam{transform:translateY(-14px)}
.bottom-nav .cam span.ic{width:56px;height:56px;border-radius:50%;background:var(--mark);color:var(--on-mark);display:grid;place-items:center;box-shadow:var(--shadow)}
@media (min-width:900px){.stats .stat{font-size:.85rem}}
/* ---- Fotos ---- */
.photo-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.big{padding:16px 12px;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:8px}
@media (max-width:420px){.photo-btns{grid-template-columns:1fr}}
@media (hover:none){.desk-only{display:none}}
/* ---- Centre del tema ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:14px;padding:18px 14px;text-align:left;display:grid;gap:4px;cursor:pointer;box-shadow:var(--shadow);font:inherit}
.tile b{font-family:var(--f-display);font-size:1.1rem}
.tile:hover{border-color:var(--blue)}
/* ---- Joc ---- */
.stars i{font-style:normal;color:var(--line2);font-size:1.15rem;letter-spacing:1px}
.stars i.on{color:#e8b400}
.combo{font-family:var(--f-display);font-weight:800;color:var(--blue);animation:pop2 .5s ease}
.pill.gold{background:#e8b400;color:#1d1a05;border-color:transparent}
.qcard.golden{border:2px solid #e8b400}
.gold-msg{font-weight:800;color:#a07800}
:root[data-theme="dark"] .gold-msg{color:#ffd84a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gold-msg{color:#ffd84a}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@keyframes pop2{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.combo{animation:none}}
.xp-pop{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}

</style>
<header class="top">
  <div class="wrap">
    <button class="iconbtn" id="back" aria-label="Enrere" hidden><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
    <a class="brand" href="#inici" aria-label="Apunts Vius, inici"><span class="logo">A</span><b>Apunts <span class="hl">Vius</span></b></a>
    <span class="top-title" id="title"></span>
    <div class="stats" id="stats"></div>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"></main>
<nav class="bottom-nav" id="nav" aria-label="Navegació principal">
  <div class="wrap">
    <button data-root="inici"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 11h3v9h6v-6h2v6h6v-9h3z"/></svg>Inici</button>
    <button data-root="nou" class="cam"><span class="ic"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></span>Nou tema</button>
    <button data-root="progres"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/></svg>Progrés</button>
  </div>
</nav>
<script>
"use strict";

const $ = (s, r = document) => r.querySelector(s);

const W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];

function fsrs(card, g, t = now()) {
  // g: 1 Again, 2 Hard, 3 Good, 4 Easy
  if (!card.reps) { card.S = W[g - 1]; card.D = d0(g); }
  else {
    const el = Math.max(0, (t - card.last) / DAY), R = retr(el, card.S);
    card.D = clampD(W[7] * d0(3) + (1 - W[7]) * (card.D - W[6] * (g - 3)));
    if (g === 1) card.S = Math.min(card.S, W[11] * Math.pow(card.D, -W[12]) * (Math.pow(card.S + 1, W[13]) - 1) * Math.exp(W[14] * (1 - R)));
    else if (el >= 0.5) card.S = card.S * (Math.exp(W[8]) * (11 - card.D) * Math.pow(card.S, -W[9]) * (Math.exp(W[10] * (1 - R)) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1) + 1);
  }
  card.S = Math.max(0.1, card.S);
  card.reps = (card.reps || 0) + 1; if (g === 1) card.lapses = (card.lapses || 0) + 1;
  card.last = t;
  card.due = g === 1 ? t + 10 * 60e3 : t + Math.max(1, Math.round(card.S)) * DAY;
}

function arr(x) { return Array.isArray(x) ? x : []; }
function normTopic(raw) {

function compileFormula(f) {

/* ---------------- Selecció de sessions ---------------- */
function buildSession(tids, n = 10, focus = null) {
  let pool = [];
  if (focus) pool = focus.slice();
  else {
    const due = [], err = [], fresh = [], rest = [];
    for (const tid of tids) { const t = topicById(tid); if (!t) continue; for (const k of topicKeys(t)) { const c = peekCard(tid, k), e = [tid, k]; if (c.pendingError) err.push(e); else if (!c.reps) fresh.push(e); else if (c.due <= now()) due.push([tid, k, c.due]); else rest.push([tid, k, c.S || 0, stateOf(c)]); } }
    due.sort((a, b) => a[2] - b[2]); rest.sort((a, b) => a[3] - b[3] || a[2] - b[2]);
    pool = [...err, ...due.map(x => [x[0], x[1]]), ...shuffle(fresh).slice(0, 5), ...rest.map(x => [x[0], x[1]])];
  }
  const chosen = []; const seen = new Set();
  for (const [tid, k] of pool) { const id = tid + "|" + k; if (seen.has(id)) continue; seen.add(id); chosen.push([tid, k]); if (chosen.length >= n) break; }
  // Intercalat: evita dos elements del mateix tipus seguits
  const out = []; let rem = shuffle(chosen);
  while (rem.length) { const last = out[out.length - 1]; let i = rem.findIndex(x => !last || (x[1][0] !== last[1][0] || x[0] !== last[0])); if (i < 0) i = 0; out.push(rem.splice(i, 1)[0]); }
  return out.map(([tid, k]) => makeItem(tid, k)).filter(Boolean);
}


/* ---------------- Sons (AudioContext, sense fitxers) i confeti ---------------- */
const Sfx = (() => {
  let ctx = null;
  const ac = () => { if (!ctx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; ctx = new A(); } if (ctx.state === "suspended") ctx.resume(); return ctx; };
  function tone(freq, start, dur, type = "sine", vol = 0.12) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  const SOUNDS = {
    ok: () => { tone(660, 0, 0.12); tone(880, 0.09, 0.16); },
    bad: () => { tone(220, 0, 0.18, "triangle", 0.1); tone(180, 0.12, 0.2, "triangle", 0.08); },
    combo: () => { [660, 784, 988].forEach((f, i) => tone(f, i * 0.07, 0.14, "square", 0.05)); },
    gold: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * 0.08, 0.22, "sine", 0.1)); },
    level: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.1, 0.3, "triangle", 0.09)); }
  };
  function play(name) { try { if (S.sound === false || !SOUNDS[name]) return; SOUNDS[name](); } catch { } }
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = document.createElement("canvas"); cv.className = "confetti"; cv.width = innerWidth; cv.height = innerHeight; document.body.appendChild(cv);
    const g = cv.getContext("2d"), cols = ["#e8b400", "#2a6fdb", "#2e9e5b", "#d6455d", "#8a5cd6"];
    const ps = Array.from({ length: 120 }, () => ({ x: innerWidth / 2 + (Math.random() - 0.5) * 120, y: innerHeight * 0.35, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 12 - 4, r: Math.random() * 6 + 3, c: pick(cols), a: Math.random() * 6 }));
    let f = 0;
    (function step() {
      g.clearRect(0, 0, cv.width, cv.height);
      ps.forEach(p => { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.a += 0.2; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); });

    })();
    setTimeout(() => cv.remove(), 3000); // si la pestanya passa a segon pla, rAF s'atura
  }
  return { play, confetti };
})();

function addXP(n, why) { if (n <= 0) return; S.xp += n; popXP("+" + n + " XP · " + why); }
function popXP(text) { const d = document.createElement("div"); d.className = "xp-pop"; d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), 1900); renderStats(); }
function logError(tid, key, label, diag) {

  if (open) { open.n++; open.diag = diag; open.t = now(); }
  else S.errors.unshift({ tid, key, label, diag, t: now(), n: 1, fixed: false });
  S.errors = S.errors.slice(0, 200);
}
function fixError(tid, key) { const e = S.errors.find(e => e.tid === tid && e.key === key && !e.fixed); if (e) { e.fixed = true; e.tf = now(); S.fixed++; return true; } return false; }

/* Registra un intent: grade 1-4, xp segons l'esforç útil */
function record(tid, key, { ok, firstTry, hint, conf, label, diag }) {
  const c = card(tid, key), wasDue = c.reps && c.due <= now() && (now() - c.last) >= 0.5 * DAY, before = stateOf(c);
  let g = !ok ? 1 : (hint || !firstTry) ? 2 : conf === "segur" ? 4 : 3;
  fsrs(c, g);
  let xp = 0, why = [];
  if (ok) {
    if (firstTry && !hint) {
      c.streak++;
      const d = dayKey(); if (!c.okDays.includes(d)) c.okDays = [...c.okDays, d].slice(-10);
      if (before < 3 || wasDue) { xp += 10; why.push("encert al primer intent"); }
    } else { c.streak = 0; xp += 4; why.push(hint ? "encert amb pista" : "encert al segon intent"); }
    if (c.pendingError) { c.pendingError = false; if (fixError(tid, key)) { xp += 8; why.push("error corregit"); } }
    if (wasDue) { xp += 5; why.push("repàs a temps"); }
  } else {
    c.streak = 0; c.pendingError = true; logError(tid, key, label, diag);
  }
  if (conf === "segur" || conf === "crec") { S.calib[conf][1]++; if (ok) S.calib[conf][0]++; if ((conf === "segur") === ok && ok) { xp += 2; why.push("ben calibrat"); } }
  markDay();
  const after = stateOf(c);
  if (xp) addXP(xp, why.join(" + "));
  checkBadges(); save();
  return { before, after, xp, noXP: ok && firstTry && !hint && before >= 3 && !wasDue };
}

/* ---------------- Sessions: combo, pregunta d'or i estrelles ----------------

   i només dona bonus si l'encert ja sumava XP (no es pot farmejar el que ja domines). */
function totalStars() { return Object.values(S.stars || {}).reduce((a, b) => a + b, 0); }

  P.combo = 0; P.maxCombo = 0;
  const cands = P.items.map((_, i) => i).filter(i => i >= 2);
  P.golden = cands.length ? pick(cands) : -1;
}
function isGolden(P, idx) { return P.golden === idx; }

function onAnswer(P, idx, { ok, first, rec }) {
  let html = "";

    P.combo++; P.maxCombo = Math.max(P.maxCombo, P.combo);
    if (P.combo >= 3 && rec && rec.xp > 0) { const b = P.combo >= 5 ? 3 : 2; S.xp += b; popXP(`Combo x${P.combo} · +${b} XP`); }
    if (P.combo >= 3) { html += `<p class="combo">Combo x${P.combo}</p>`; Sfx.play("combo"); } else Sfx.play("ok");

  if (isGolden(P, idx)) {

  }

  save();

}
/* Estrelles per tema: 1 = 60% al primer intent, 2 = 80%, 3 = tot bé (mínim 5 preguntes) */
function finishSession(P) {
  S.sessions = (S.sessions || 0) + 1;
  const won = {};
  for (const tid of P.tids) {
    const rs = P.results.filter(r => r.item.tid === tid); if (rs.length < 3) continue;
    const f = rs.filter(r => r.first).length / rs.length;
    const st = f === 1 && rs.length >= 5 ? 3 : f >= 0.8 ? 2 : f >= 0.6 ? 1 : 0;
    if (st > (S.stars[tid] || 0)) { S.stars[tid] = st; won[tid] = st; }
  }
  if (Object.keys(won).length) { Sfx.play("level"); Sfx.confetti(); }

}

  t.conceptes.filter(c => c.paraules_clau.length >= 2).slice(0, 3).forEach(c => t.preguntes_obertes.push({ id: "o_" + c.id, pregunta: `Explica què és ${/^[aeiouàèéíòóú]/i.test(c.nom) ? "l'" : "el/la "}${c.nom}${c.exemple ? " i posa'n un exemple" : ""}.`, resposta_model: c.definicio + (c.exemple ? " Exemple: " + c.exemple : ""), criteris: [...c.paraules_clau.slice(0, 3).map(k => `Fa servir la idea de «${k}»`), ...(c.exemple ? ["Posa un exemple adequat"] : [])], concepte_id: c.id }));
  t.procediments.slice(0, 1).forEach(p => t.preguntes_obertes.push({ id: "o_" + p.id, pregunta: `Descriu els passos per a: ${p.nom.toLowerCase()}.`, resposta_model: p.passos.join(" "), criteris: [`Comença amb: ${p.passos[0]}`, `Acaba amb: ${p.passos[p.passos.length - 1]}`, "Els passos estan en l'ordre correcte"] }));
  t.seccions = t.seccions.filter(s => s.punts.length);
  return t;
}

function conceptMap(t) {

  const W0 = Math.max(560, nodes.length * 90), H0 = 380, cx = W0 / 2, cy = H0 / 2, R = Math.min(W0 / 2 - 90, H0 / 2 - 40);
  const pos = {}; nodes.forEach((n, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / nodes.length; pos[n] = [cx + R * Math.cos(a) * 1.25, cy + R * Math.sin(a)]; });
  const edges = t.relacions.map(r => { const [x1, y1] = pos[r.a], [x2, y2] = pos[r.b], mx = (x1 + x2) / 2, my = (y1 + y2) / 2; return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line2)" stroke-width="2" marker-end="url(#ar)"/><text x="${mx}" y="${my - 6}" text-anchor="middle" font-size="12" fill="var(--blue)" font-family="var(--f-body)" font-weight="700" paint-order="stroke" stroke="var(--sheet)" stroke-width="4">${esc(r.tipus)}</text>`; }).join("");
  const ns = nodes.map(n => { const [x, y] = pos[n], w = Math.max(70, n.length * 7.6 + 20); return `<rect x="${x - w / 2}" y="${y - 15}" width="${w}" height="30" rx="15" fill="var(--sheet)" stroke="var(--ink)" stroke-width="1.5"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="var(--f-body)">${esc(n)}</text>`; }).join("");
  return `<svg width="${W0}" height="${H0}" viewBox="0 0 ${W0} ${H0}" role="img" aria-label="Mapa conceptual"><defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line2)"/></marker></defs>${edges}${ns}</svg>`;
}

function labWin(t, key, chId, label) {

      ${f.constList.length ? `<p class="small muted">Constants: ${f.constList.map(c => `${esc(c.simbol)} = ${fmt(c.valor)} ${esc(c.unitat || "")}`).join(", ")}</p>` : ""}

function buildExam(tids, n, mins, boss) {

function criterionHit(crit, ans) {
  if (!ans) return false;
  const q = crit.match(/«([^»]+)»/); const words = (q ? q[1] : crit).split(/\s+/).map(norm).filter(w => w.length > 3 && !STOP.has(w));
  if (!words.length) return false;
  const a = " " + norm(ans) + " ";
  const hits = words.filter(w => a.includes(" " + w.slice(0, Math.max(4, w.length - 2)))).length;
  return hits / words.length >= (q ? 0.99 : 0.5);
}

function wirePhotos(el) {

  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); add(e.dataTransfer.files); };

async function prepPhoto(p) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(p.file); });
  const max = 2400, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * sc), hh = Math.round(img.naturalHeight * sc), rot = p.rot % 180 !== 0;
  const cv = document.createElement("canvas"); cv.width = rot ? hh : w; cv.height = rot ? w : hh;
  const ctx = cv.getContext("2d"); ctx.translate(cv.width / 2, cv.height / 2); ctx.rotate(p.rot * Math.PI / 180); ctx.drawImage(img, -w / 2, -hh / 2, w, hh);
  p.blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.92));
  if (p.url) URL.revokeObjectURL(p.url); p.url = URL.createObjectURL(p.blob);
}

    const topic = { ...d, conceptes: d.conceptes.filter(c => !c.off && c.nom && c.definicio), formules: d.formules.filter(f => !f.off && !fCheck(f)) };
    const names = new Set(topic.conceptes.map(c => norm(c.nom)));
    topic.preguntes_obertes = (d.preguntes_obertes || []).filter(q => !q.concepte_id || topic.conceptes.some(c => c.id === q.concepte_id));
    topic.relacions = topic.relacions.filter(r => r.a && r.b);
    topic.conceptes.forEach(c => { if (c.dubtos && !suspicious(c.definicio)) { c.dubtos = false; c.motiu = ""; } });
    if (!topic.resum || topic.resum.length < 20) topic.resum = topic.conceptes.slice(0, 4).map(c => `${cap1(c.nom)}: ${c.definicio}`).join(" ");
    if (!topic.seccions.length) topic.seccions = [{ titol: "Idees clau", punts: topic.conceptes.slice(0, 8).map(c => `${cap1(c.nom)}: ${c.definicio}`) }];
    if (!names.size && !topic.formules.length) { $("#genOut", el).innerHTML = `<div class="fb warn">Cal com a mínim un concepte o una fórmula.</div>`; return; }
    const ok = addTopic(topic, $("#genOut", el), topic.materia, topic.curs);
    if (ok) newState = { photos: [], text: "", draft: null };
  };
}
function addTopic(raw, out, mat, curs) {
  const t = normTopic({ ...raw, materia: raw.materia || mat, curs: raw.curs || curs, id: raw.id || slug(raw.titol || "tema") });
  if (S.topics[t.id] || DEMOS.some(d => d.id === t.id)) t.id = t.id + "_" + Date.now().toString(36).slice(-4);
  if (t.conceptes.length < 2 && !t.formules.length) { out.innerHTML = `<div class="fb bad">El tema té massa poc contingut (${t.conceptes.length} conceptes). Afegeix-ne més.</div>`; return false; }
  const C = compile(t);
  S.topics[t.id] = t; S.active = t.id; checkBadges(); save();
  out.innerHTML = `<div class="fb ok"><h3>Tema creat: ${esc(t.titol)}</h3><p>${t.conceptes.length} conceptes · ${C.formules.length} fórmules · ${t.procediments.length} procediments · ${t.errors_tipics.length} errors típics · ${t.preguntes_obertes.length} preguntes d'examen.</p><div class="row"><button class="btn primary" id="openT">Obrir el tema</button></div></div>`;
  $("#openT", out).onclick = () => Router.root("inici", "tema");
  return true;
}


/* ---------------- Router: pila de pantalles ----------------
   Cada pantalla és una funció view(el). La pila es desa a l'historial del navegador,
   de manera que el botó «enrere» d'Android (i del navegador) torna a la pantalla anterior. */
let practiceSession = null, examSession = null, examTimer = null;
const SCREENS = {
  inici: { title: "Inici", view: () => viewHome, root: true },
  nou: { title: "Nou tema", view: () => viewNew, root: true },
  progres: { title: "Progrés", view: () => viewProgress, root: true },
  tema: { title: "Tema", view: () => viewTopic, needsTopic: true },
  apunts: { title: "Apunts", view: () => viewNotes, needsTopic: true },
  lab: { title: "Laboratori", view: () => viewLab, needsTopic: true },
  practica: { title: "Pràctica", view: () => viewPractice },
  examen: { title: "Examen", view: () => viewExam }
};
const Router = {
  stack: ["inici"],
  cur() { return this.stack[this.stack.length - 1]; },
  push(name) {
    if (!SCREENS[name]) name = "inici";
    if (this.cur() === name) return render();
    this.stack.push(name); history.pushState({ stack: this.stack.slice() }, "", "#" + name); render();
  },
  back() { if (this.stack.length > 1) history.back(); else this.root("inici"); },
  root(name, ...more) {
    this.stack = [name, ...more].filter(n => SCREENS[n]);
    if (!this.stack.length) this.stack = ["inici"];
    history.replaceState({ stack: this.stack.slice() }, "", "#" + this.cur()); render();
  },
  init() {
    const h = location.hash.replace("#", "");
    this.stack = SCREENS[h] ? (SCREENS[h].root ? [h] : ["inici", h]) : ["inici"];
    history.replaceState({ stack: this.stack.slice() }, "", "#" + this.cur());
    addEventListener("popstate", e => { const st = e.state && e.state.stack; this.stack = Array.isArray(st) && st.length ? st.filter(n => SCREENS[n]) : ["inici"]; render(); });
  }
};
/* Compatibilitat: go() obre una pantalla (les arrels reinicien la pila) */
function go(name) { const s = SCREENS[name]; if (s && s.root) Router.root(name); else Router.push(name); }

function renderStats() {
  const el = $("#stats"); if (!el) return;
  const g = globalStats(), ws = weekStreak();
  el.innerHTML = `<span class="stat" title="Temari consolidat o dominat"><strong>${Math.round(g.domini * 100)}%</strong></span><span class="stat" title="XP: només per esforç útil"><strong>${S.xp}</strong> XP</span><span class="stat" title="Ratxa setmanal"><strong>${ws.streak}</strong> set.</span>`;
}
function renderChrome() {
  const sc = SCREENS[Router.cur()];
  $("#back").hidden = Router.stack.length <= 1;
  $("#title").textContent = sc.root ? "" : sc.title;
  $(".brand").hidden = !sc.root;
  $$("#nav [data-root]").forEach(b => b.setAttribute("aria-current", Router.stack[0] === b.dataset.root ? "page" : "false"));
  renderStats();
}
function render() {
  let sc = SCREENS[Router.cur()];
  if (sc.needsTopic && !topicById(S.active)) { Router.stack = ["inici"]; sc = SCREENS.inici; history.replaceState({ stack: ["inici"] }, "", "#inici"); }
  renderChrome();
  sc.view()($("#view"));
  window.scrollTo(0, 0);
}

/* ---------------- Arrencada ---------------- */
function compileAll() {
  DEMOS.forEach(d => compile(normTopic(d)));
  Object.values(S.topics).forEach(t => { try { compile(t); } catch (e) { console.warn("Tema descartat", e); delete S.topics[t.id]; } });
  if (S.active && !COMPILED[S.active]) S.active = null;
}
function boot() {
  loadState(); compileAll();
  $("#back").onclick = () => Router.back();
  $$("#nav [data-root]").forEach(b => b.onclick = () => Router.root(b.dataset.root));
  Router.init(); render();
}
boot();

</script>
